<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#000000">

  <title>APITOTO</title>

  <link rel="stylesheet" href="./styles.css">
</head>

<body>

  <!-- LOGO APITOTO -->
  <header class="mobile-header">
    <img
      src="https://i.postimg.cc/QM9vvkhY/Logo999.png"
      alt="Logo APITOTO"
      class="header-image"
    >
  </header>

  <!-- SLOGAN APITOTO -->
  <section class="slogan-banner">
    <img
      src="https://i.postimg.cc/zfDMZ0QL/slogan.png"
      alt="Satu Tujuan, Satu Kemenangan"
      class="slogan-image"
    >
  </section>

  <!-- BANNER UTAMA -->
  <section class="main-banner">
    <img
      src="https://i.postimg.cc/VN4mdL0H/banner-1.png"
      alt="Banner utama APITOTO"
      class="main-banner-image"
    >
  </section>

  <!-- TOMBOL DAFTAR DAN LOGIN -->
  <nav class="action-panel" aria-label="Menu akun">
    <a
      href="LINK-DAFTAR"
      class="action-button register-button"
    >
      DAFTAR
    </a>

    <a
      href="LINK-LOGIN"
      class="action-button login-button"
    >
      LOGIN
    </a>
  </nav>

  <main class="page-content"></main>

  <!-- TOMBOL GAMBAR LIVE CHAT APITOTO -->
  <a
    href="#"
    class="livechat-button"
    onclick="bukaLiveChat(); return false;"
    aria-label="Buka Live Chat APITOTO"
  >
    <img
      src="https://i.postimg.cc/Gt8w8BXM/Livechat.png"
      alt="Live Chat APITOTO"
    >
  </a>

  <!-- TAWK.TO LIVE CHAT -->
  <script type="text/javascript">
    var Tawk_API = Tawk_API || {};
    var Tawk_LoadStart = new Date();

    /* Menyembunyikan logo/ikon bawaan Tawk.to */
    Tawk_API.onBeforeLoad = function () {
      Tawk_API.hideWidget();
    };

    Tawk_API.onLoad = function () {
      Tawk_API.hideWidget();
    };

    /* Ikon bawaan tetap disembunyikan setelah chat diminimalkan */
    Tawk_API.onChatMinimized = function () {
      Tawk_API.hideWidget();
    };

    /* Membuka chat melalui tombol gambar APITOTO */
    function bukaLiveChat() {
      if (
        typeof Tawk_API.showWidget === "function" &&
        typeof Tawk_API.maximize === "function"
      ) {
        Tawk_API.showWidget();
        Tawk_API.maximize();
      } else {
        alert("Live Chat sedang dimuat. Silakan coba kembali.");
      }
    }

    /* Memuat widget Tawk.to */
    (function () {
      var s1 = document.createElement("script");
      var s0 = document.getElementsByTagName("script")[0];

      s1.async = true;
      s1.src =
        "https://embed.tawk.to/6a72a04b6677831d43f6c326/1jv7s4a99";
      s1.charset = "UTF-8";
      s1.setAttribute("crossorigin", "*");

      s0.parentNode.insertBefore(s1, s0);
    })();
  </script>
  <!-- END TAWK.TO LIVE CHAT -->

</body>
</html>
