<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#000000">

  <title>APITOTO</title>

  <link rel="stylesheet" href="./styles.css">
</head>

<body>

  <!-- LOGO APITOTO -->
  <header class="mobile-header">
    <img
      src="https://i.postimg.cc/QM9vvkhY/Logo999.png"
      alt="Logo APITOTO"
      class="header-image"
    >
  </header>

  <!-- SLOGAN APITOTO -->
  <section class="slogan-banner">
    <img
      src="https://i.postimg.cc/zfDMZ0QL/slogan.png"
      alt="Satu Tujuan, Satu Kemenangan"
      class="slogan-image"
    >
  </section>

  <!-- BANNER PHOENIX DAN SINGGASANA -->
  <section class="main-banner">
    <img
      src="https://i.postimg.cc/VN4mdL0H/banner-1.png"
      alt="Banner utama APITOTO"
      class="main-banner-image"
    >
  </section>

  <!-- TOMBOL DAFTAR DAN LOGIN -->
  <nav class="action-panel" aria-label="Menu akun">
    <a
      href="LINK-DAFTAR"
      class="action-button register-button"
    >
      DAFTAR
    </a>

    <a
      href="LINK-LOGIN"
      class="action-button login-button"
    >
      LOGIN
    </a>
  </nav>

  <!-- KONTEN BERIKUTNYA -->
  <main class="page-content"></main>

  <!-- TOMBOL LIVE CHAT -->
  <a
    href="LINK-LIVECHAT"
    class="livechat-button"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Buka layanan live chat"
  >
    <img
      src="https://i.postimg.cc/Gt8w8BXM/Livechat.png"
      alt="Live Chat"
    >
  </a>

</body>
</html>
